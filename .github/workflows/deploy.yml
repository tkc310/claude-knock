# main の CI が通ったら、ビルドして Cloudflare Workers の静的アセットへデプロイする（ADR-0016）。
# 毎年 1 月 1 日（日本時間）にも、main をビルドし直す。表示する範囲（今年と来年）がビルドした日で決まるため（ADR-0022）
# 必要なもの: secrets の CLOUDFLARE_API_TOKEN・CLOUDFLARE_ACCOUNT_ID
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
  # cron は UTC。日本時間の 1 月 1 日 0 時 5 分
  schedule:
    - cron: '5 15 31 12 *'

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    # CI が通った main の push、1 月 1 日の定期実行（main）、手動の実行（main のときだけ）
    if: >-
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push') ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # 「今年」を日本時間で数える（ランナーは UTC）
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@v7
        with:
          # CI が確かめたコミットそのものを配る
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: jdx/mise-action@v5
        with:
          install: false
          cache: true

      - name: Node.js・pnpm を入れる（.tool-versions）
        run: make tools

      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/pnpm-store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('.tool-versions', 'pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: 依存を入れる
        run: make install
        env:
          pnpm_config_store_dir: ${{ runner.temp }}/pnpm-store

      # build・verify の後に wrangler で dist/ を送る（make deploy。手元と同じ）
      - name: ビルドしてデプロイする
        run: make deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
